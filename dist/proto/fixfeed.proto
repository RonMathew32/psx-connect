syntax = "proto3";

package fix;

import "google/protobuf/timestamp.proto";

// The FIX feed service definition
service FIXFeed {
  rpc FeedHeartbeat (HeartbeatMessage) returns (ServerReply);
  rpc MarketStatus (MarketStatusMessage) returns (ServerReply);
  rpc IndexList (IndexListMessage) returns (ServerReply);
  rpc SymbolList (SymbolListMessage) returns (ServerReply);
  rpc IndexSnapshot (IndexSnapshotMessage) returns (ServerReply);
  rpc SymbolSnapshot (SymbolSnapshotMessage) returns (ServerReply);
  rpc SymbolUpdate (SymbolUpdateMessage) returns (ServerReply);
}

message HeartbeatMessage {
  google.protobuf.Timestamp timestamp = 1;
}

message MarketStatusMessage {
  google.protobuf.Timestamp timestamp = 1;
  string session_id = 2;
  string status = 3;
}

message IndexListMessage {
  google.protobuf.Timestamp timestamp = 1;
  string product = 2;
  string session_id = 3;
}

message SymbolListMessage {
  google.protobuf.Timestamp timestamp = 1;
  string product = 2;
  string session_id = 3;
  repeated string symbols = 4;
}

message IndexSnapshotMessage {
  google.protobuf.Timestamp timestamp = 1;
  string indexname = 2;
  string value = 3;
  string volume = 4;
  string net_change = 5;
}

message SymbolSnapshotMessage {
  google.protobuf.Timestamp timestamp = 1;
  string entry_date = 2;
  string entry_time = 3;
  string symbol = 4;
  string price = 5;
  string quantity = 6;
  string net_change = 7;
  string change = 8;
  string price_delta = 9;
  string trade_volume = 10;
  string session_status = 11;
}

message SymbolUpdateMessage {
  google.protobuf.Timestamp timestamp = 1;
  string entry_date = 2;
  string entry_time = 3;
  string symbol = 4;
  string price = 5;
  string quantity = 6;
  string net_change = 7;
  string change = 8;
  string price_delta = 9;
  string trade_volume = 10;
  string session_status = 11;
}

message ServerReply {
  google.protobuf.Timestamp timestamp = 1;
  int32 status = 2;
  string message = 3;
} 